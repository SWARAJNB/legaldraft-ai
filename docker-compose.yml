services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - local-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=legaldraft_ai
      - POSTGRES_USER=legaldraft
      - POSTGRES_PASSWORD=legaldraft_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U legaldraft -d legaldraft_ai" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
      - ./backend/ai.env
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - STORAGE_MODE=local
      - LOCAL_STORAGE_DIR=/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
  postgres-data:
